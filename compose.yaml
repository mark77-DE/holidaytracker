services:
  web:
    build:
      context: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build:
      context: ./api
    environment:
      DATA_DIR: /data
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - holidaytracker-data:/data
    expose:
      - "8000"
    restart: unless-stopped
volumes:
  holidaytracker-data:
